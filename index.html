```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas Seguras</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }

        .password-box {
            display: flex;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .password-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f8fafc;
            padding: 12px 16px;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .password-box button {
            background: #334155;
            border: none;
            color: #f8fafc;
            padding: 0 16px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background 0.2s;
        }

        .password-box button:hover {
            background: #475569;
        }

        .settings {
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .setting input[type="range"] {
            width: 130px;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        .setting label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .setting input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        #generate-btn {
            width: 100%;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        #generate-btn:hover {
            background-color: #0ea5e9;
        }

        #generate-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gerador de Senhas</h1>
        
        <div class="password-box">
            <input type="text" id="password" readonly placeholder="Sua senha aparecerá aqui">
            <button id="copy-btn" title="Copiar senha">📋</button>
        </div>

        <div class="settings">
            <div class="setting">
                <label for="length">Tamanho: <strong id="length-value">12</strong></label>
                <input type="range" id="length" min="6" max="32" value="12">
            </div>

            <div class="setting">
                <label for="uppercase">
                    <input type="checkbox" id="uppercase" checked>
                    Incluir Maiúsculas (A-Z)
                </label>
            </div>

            <div class="setting">
                <label for="lowercase">
                    <input type="checkbox" id="lowercase" checked>
                    Incluir Minúsculas (a-z)
                </label>
            </div>

            <div class="setting">
                <label for="numbers">
                    <input type="checkbox" id="numbers" checked>
                    Incluir Números (0-9)
                </label>
            </div>

            <div class="setting">
                <label for="symbols">
                    <input type="checkbox" id="symbols" checked>
                    Incluir Símbolos (!@#$)
                </label>
            </div>
        </div>

        <button id="generate-btn">Gerar Senha</button>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const lengthSlider = document.getElementById('length');
        const lengthValue = document.getElementById('length-value');
        const uppercaseEl = document.getElementById('uppercase');
        const lowercaseEl = document.getElementById('lowercase');
        const numbersEl = document.getElementById('numbers');
        const symbolsEl = document.getElementById('symbols');
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');

        const upperLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const lowerLetters = 'abcdefghijklmnopqrstuvwxyz';
        const numbers = '0123456789';
        const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        lengthSlider.addEventListener('input', () => {
            lengthValue.textContent = lengthSlider.value;
        });

        function getCharacters() {
            let chars = '';
            if (uppercaseEl.checked) chars += upperLetters;
            if (lowercaseEl.checked) chars += lowerLetters;
            if (numbersEl.checked) chars += numbers;
            if (symbolsEl.checked) chars += symbols;
            return chars;
        }

        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            const chars = getCharacters();

            if (chars === '') {
                alert('Selecione pelo menos um tipo de caractere!');
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }

            passwordInput.value = password;
        }

        copyBtn.addEventListener('click', () => {
            if (!passwordInput.value) return;
            
            navigator.clipboard.writeText(passwordInput.value);
            
            const originalIcon = copyBtn.textContent;
            copyBtn.textContent = '✅';
            setTimeout(() => {
                copyBtn.textContent = originalIcon;
            }, 1500);
        });

        generateBtn.addEventListener('click', generatePassword);
        generatePassword();
    </script>
</body>
</html>
